<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080d1c">
<link rel="apple-touch-icon" href="icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1c">
<title>StudyMate AI</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
width:100%;
min-height:100%;
font-family:Arial,Helvetica,sans-serif;
background:#080d1c;
color:#fff;
}

body{overflow-x:hidden}

button,input,select{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.app{
width:100%;
max-width:680px;
margin:auto;
min-height:100vh;
padding-bottom:90px;
}

.screen{padding:18px}

.center{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:18px;
}

.logo{
width:78px;
height:78px;
border-radius:24px;
background:linear-gradient(135deg,#635bff,#a15cff);
display:flex;
align-items:center;
justify-content:center;
font-size:38px;
font-weight:900;
margin:0 auto 18px;
box-shadow:0 15px 40px rgba(99,91,255,.3);
}

.card{
background:#11182b;
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:17px;
margin-bottom:14px;
}

h1,h2,h3,p{margin-top:0}
h1{font-size:30px}
h2{font-size:23px}

p{
color:#9ca8c5;
line-height:1.5;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:7px;
color:#cbd3e7;
}

.input-group{margin-bottom:15px}

input,select{
width:100%;
padding:13px;
border-radius:13px;
border:1px solid rgba(255,255,255,.09);
background:#080e1e;
color:#fff;
outline:none;
}

input:focus,select:focus{border-color:#7068ff}

.btn{
width:100%;
padding:14px;
margin-top:8px;
border:0;
border-radius:14px;
background:linear-gradient(135deg,#655dff,#9a58ff);
color:#fff;
font-weight:bold;
}

.btn.secondary{background:#19233d}
.btn.danger{background:#49202d}

.topbar{
height:65px;
display:flex;
align-items:center;
justify-content:space-between;
padding:10px 18px;
}

.brand{
font-size:20px;
font-weight:900;
}

.brand span{color:#8179ff}

.avatar{
width:43px;
height:43px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
background:linear-gradient(135deg,#655dff,#9b59ff);
}

.greeting{padding:15px 18px 5px}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
background:#11182b;
border:1px solid rgba(255,255,255,.08);
border-radius:17px;
padding:15px;
}

.stat span{
font-size:12px;
color:#8f9bb8;
}

.stat b{
font-size:25px;
display:block;
margin-top:5px;
}

.stat .mini{
font-size:11px;
color:#7f8ba7;
font-weight:normal;
}

.section-title{
display:flex;
align-items:center;
justify-content:space-between;
margin:20px 0 10px;
}

.subject-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.subject-card{
background:#121b31;
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
padding:14px;
}

.subject-icon{
font-size:25px;
margin-bottom:7px;
}

.subject-card small{color:#8995b1}

.chips{
display:flex;
flex-wrap:wrap;
gap:8px;
}

.chip{
border:1px solid rgba(255,255,255,.1);
background:#0c1324;
color:#cbd3e7;
padding:9px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.chip.selected{
background:rgba(102,94,255,.2);
border-color:#756dff;
color:#fff;
}

.nav{
position:fixed;
left:50%;
bottom:0;
transform:translateX(-50%);
width:100%;
max-width:680px;
height:72px;
display:grid;
grid-template-columns:repeat(5,1fr);
background:#090f20;
border-top:1px solid rgba(255,255,255,.08);
z-index:50;
}

.nav button{
border:0;
background:none;
color:#78849f;
font-size:11px;
font-weight:bold;
}

.nav button.active{color:#8c84ff}

.nav-icon{
display:block;
font-size:21px;
margin-bottom:3px;
}

.progress{
height:8px;
background:#202a43;
border-radius:20px;
overflow:hidden;
margin:12px 0 18px;
}

.progress div{
height:100%;
background:linear-gradient(90deg,#675fff,#a15cff);
transition:width .3s ease;
}

.option{
width:100%;
padding:14px;
margin-top:9px;
border-radius:14px;
border:1px solid rgba(255,255,255,.09);
background:#121b31;
color:#fff;
text-align:left;
}

.option.correct{
border-color:#27c987;
background:rgba(39,201,135,.13);
}

.option.wrong{
border-color:#ff5c70;
background:rgba(255,92,112,.13);
}

.option:disabled{opacity:1}

.question-meta{
font-size:12px;
color:#8995b2;
margin-bottom:12px;
}

.answer-box{
background:#0b1223;
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
padding:14px;
margin-top:15px;
}

.notice{
background:#111a30;
border:1px solid rgba(255,255,255,.08);
padding:13px;
border-radius:14px;
font-size:13px;
color:#aeb8ce;
line-height:1.5;
}

.flashcard{
width:100%;
min-height:250px;
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
background:linear-gradient(145deg,#151f38,#0e1629);
color:#fff;
font-size:21px;
font-weight:bold;
padding:25px;
line-height:1.5;
}

.small-row{
display:flex;
gap:8px;
margin-top:8px;
}

.small-btn{
flex:1;
padding:11px;
border-radius:11px;
border:1px solid rgba(255,255,255,.08);
background:#18223b;
color:#fff;
font-weight:bold;
}

.score-big{
font-size:55px;
font-weight:900;
text-align:center;
color:#8b83ff;
margin:20px 0;
}

.back{
border:0;
background:none;
color:#968fff;
font-weight:bold;
padding:0;
margin-bottom:15px;
}

.calc-display{
background:#070c18;
border:1px solid rgba(255,255,255,.08);
border-radius:15px;
padding:18px;
min-height:65px;
font-size:28px;
text-align:right;
overflow:auto;
margin-bottom:10px;
}

.calc-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.calc-grid button{
border:0;
border-radius:13px;
padding:17px 5px;
background:#19233d;
color:#fff;
font-weight:bold;
}

.calc-grid .equal{background:#655dff}

.level-badge{
display:inline-block;
padding:7px 11px;
border-radius:20px;
background:rgba(102,94,255,.15);
border:1px solid rgba(117,109,255,.35);
color:#aaa3ff;
font-size:12px;
font-weight:bold;
}

.streak-box{
display:flex;
align-items:center;
justify-content:space-between;
background:linear-gradient(135deg,#171d39,#211737);
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
padding:16px;
margin-bottom:14px;
}

.streak-number{
font-size:32px;
font-weight:900;
}

.xp-bar{
height:7px;
background:#202a43;
border-radius:20px;
overflow:hidden;
margin-top:8px;
}

.xp-bar div{
height:100%;
background:linear-gradient(90deg,#655dff,#a15cff);
}

.goal-item{
display:flex;
align-items:center;
gap:12px;
}

.goal-circle{
width:52px;
height:52px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#19233d;
font-weight:900;
flex-shrink:0;
}

.empty{
text-align:center;
padding:25px 10px;
color:#8f9bb8;
}

table{
width:100%;
border-collapse:collapse;
}

td{
padding:10px 3px;
border-bottom:1px solid rgba(255,255,255,.08);
font-size:13px;
color:#b9c2d7;
}

td:last-child{
text-align:right;
color:#fff;
font-weight:bold;
}

hr{
border:0;
border-top:1px solid rgba(255,255,255,.08);
margin:16px 0;
}

@media(max-width:400px){
.subject-grid{grid-template-columns:1fr}
}
</style>
</head>

<div id="onboarding" class="center">

<div class="logo">S</div>

<div class="card">

<h1 style="text-align:center">StudyMate AI</h1>

<p style="text-align:center">
Your offline study companion.
</p>

<label>Nickname</label>
<input id="nameInput" type="text" placeholder="Enter your nickname">
</div>

<div class="input-group">
<label>School Level</label>
<select id="levelInput">

<option value="Secondary">Secondary</option>
</select>
</div>

<div class="input-group">
<label>Class</label>
<select id="classInput"></select>
</div>

<div class="input-group">
<label>Country / Curriculum</label>
<select id="countryInput">
<option>Nigeria</option>
<option>Ghana</option>
<option>United Kingdom</option>
<option>United States</option>
<option>International</option>
</select>
</div>

<div class="input-group">
<label>Subjects</label>
<div id="subjectChips" class="chips"></div>
</div>

<div class="input-group">
<label>Focus Topics</label>
<div id="topicChips" class="chips"></div>
</div>

<button id="startBtn" class="btn">
Start Studying 🚀
</button>

</div>
</div>
</div>


<div id="app" class="app hidden">

<div class="topbar">

<div class="brand">
Study<span>Mate</span> AI
</div>

<div id="avatar" class="avatar">S</div>

</div>

<main id="main"></main>

<div class="nav">

<button data-page="home" class="active">
<span class="nav-icon">⌂</span>
Home
</button>

<button data-page="ask">
<span class="nav-icon">💬</span>
Ask
</button>

<button data-page="quiz">
<span class="nav-icon">📝</span>
Quiz
</button>

<button data-page="flash">
<span class="nav-icon">📚</span>
Cards
</button>

<button data-page="profile">
<span class="nav-icon">👤</span>
Profile
</button>

</div>
</div>

function $(id){

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function shuffle(array){

var copy=array.slice();

for(var i=copy.length-1;i>0;i--){

var j=Math.floor(Math.random()*(i+1));

var temp=copy[i];
copy[i]=copy[j];
copy[j]=temp;

}

return copy;

}


function todayKey(){

var d=new Date();

return d.getFullYear()+"-"+

String(d.getMonth()+1).padStart(2,"0")+"-"+

String(d.getDate()).padStart(2,"0");

}


function yesterdayKey(){

var d=new Date();

d.setDate(d.getDate()-1);

return d.getFullYear()+"-"+

String(d.getMonth()+1).padStart(2,"0")+"-"+

String(d.getDate()).padStart(2,"0");

}

========================================================= */

function loadProfile(){

try{

var saved=localStorage.getItem("studymate_profile");

if(!saved){

profile=null;
return;

}

profile=JSON.parse(saved);

if(!profile || typeof profile!=="object"){

profile=null;
return;

}

if(!profile.name) profile.name="Student";

if(!profile.level) profile.level="Secondary";

if(!profile.className) profile.className="SS 1";

if(!profile.country) profile.country="Nigeria";

if(!Array.isArray(profile.subjects) ||
profile.subjects.length===0){

profile.subjects=["Mathematics"];

}

if(!Array.isArray(profile.topics)){
profile.topics=[];
}

if(!profile.stats ||
typeof profile.stats!=="object"){

profile.stats={};

}

if(typeof profile.stats.quizzes!=="number")
profile.stats.quizzes=0;

if(typeof profile.stats.answered!=="number")
profile.stats.answered=0;

if(typeof profile.stats.correct!=="number")
profile.stats.correct=0;

if(!profile.stats.subject ||
typeof profile.stats.subject!=="object"){

profile.stats.subject={};

}

if(!profile.stats.topic ||
typeof profile.stats.topic!=="object"){

profile.stats.topic={};

}


/* NEW UPGRADE DATA */

if(typeof profile.stats.xp!=="number")
profile.stats.xp=0;

if(typeof profile.stats.streak!=="number")
profile.stats.streak=0;

if(!profile.stats.lastStudyDate)
profile.stats.lastStudyDate="";

if(!profile.stats.dailyGoal)
profile.stats.dailyGoal=10;

if(!profile.stats.todayAnswered)
profile.stats.todayAnswered=0;

if(profile.stats.todayDate!==todayKey()){

profile.stats.todayAnswered=0;
profile.stats.todayDate=todayKey();

}

saveProfile();

}catch(error){

console.log("Profile data was corrupted.");

profile=null;

try{
localStorage.removeItem("studymate_profile");
}catch(e){}

}

}


/* =========================================================
   XP + STREAK
========================================================= */

function addStudyProgress(correct){

if(!profile || !profile.stats){
return;
}

var today=todayKey();

if(profile.stats.todayDate!==today){

profile.stats.todayDate=today;
profile.stats.todayAnswered=0;

}

profile.stats.todayAnswered++;

profile.stats.xp+=correct ? 10 : 5;

var last=profile.stats.lastStudyDate;

if(last!==today){

if(last===yesterdayKey()){

profile.stats.streak++;

}else{

profile.stats.streak=1;

}

profile.stats.lastStudyDate=today;

}

saveProfile();

}


function getLevel(){

function getLevelXP(){

return xp%100;

}

escapeHTML(topics[x])+

"</button>";

$("topicChips").querySelectorAll(".chip");

topicButtons[j].addEventListener(
"click",
function(){
this.classList.toggle("selected");
}
);

}

}

function normalize(text){

return String(text)
.toLowerCase()
.replace(/[^\w\s]/g," ")
.replace(/\s+/g," ")
.trim();

}


function renderAsk(){

$("main").innerHTML=

'<section class="screen">'+

"<h2>💬 Ask StudyMate</h2>"+

'<div class="card" style="margin-top:15px">'+

'<button class="btn" id="askBtn">Find Answer 🔎</button>'+

"</div>"+

'<div id="askResult"></div>'+

'<div class="section-title"><h3>Try These</h3></div>'+

'<div class="chips">'+

'<button class="chip askExample">What is force?</button>'+

'<button class="chip askExample">What is demand?</button>'+
'<button class="chip askExample">What is a simile?</button>'+
'<button class="chip askExample">What is an atom?</button>'+

"</div>"+

"</section>";


$("askBtn").addEventListener("click",answerQuestion);

$("askInput").addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){
answerQuestion();
}

}
);

for(var i=0;i<examples.length;i++){

examples[i].addEventListener(
"click",
function(){

$("askInput").value=this.textContent;

answerQuestion();

);

}

}


function answerQuestion(){

var input=normalize($("askInput").value);

if(!input){

$("askResult").innerHTML=
'<div class="notice">Type a question first.</div>';

return;

}

var best=null;
var bestScore=0;

var words=input.split(" ");

for(var i=0;i<FLASHCARDS.length;i++){

var card=FLASHCARDS[i];

var score=0;

for(var w=0;w<words.length;w++){

var word=words[w];

if(word.length<3) continue;

if(normalize(card.front).indexOf(word)!==-1)
score+=4;

if(normalize(card.back).indexOf(word)!==-1)
score++;

if(normalize(card.subject).indexOf(word)!==-1)
score++;

if(normalize(card.topic).indexOf(word)!==-1)
score++;

}

if(score>bestScore){

bestScore=score;

best={
subject:card.subject,
topic:card.topic,
front:card.front,
back:card.back
};

}

}


for(var qIndex=0;qIndex<QUESTIONS.length;qIndex++){

var q=QUESTIONS[qIndex];

var qScore=0;

for(var z=0;z<words.length;z++){

var qWord=words[z];

if(qWord.length<3) continue;

if(normalize(q.q).indexOf(qWord)!==-1)
qScore+=4;

if(normalize(q.e).indexOf(qWord)!==-1)
qScore++;

if(normalize(q.subject).indexOf(qWord)!==-1)
qScore++;

if(normalize(q.topic).indexOf(qWord)!==-1)
qScore++;

}

if(qScore>bestScore){

bestScore=qScore;

best={
subject:q.subject,
topic:q.topic,
front:q.q,
back:q.e
};

}

}


if(!best || bestScore<2){

$("askResult").innerHTML=

'<div class="card">'+
"<h3>🤔 I don't have a verified answer offline.</h3>"+
"<p>I don't want to guess and teach you something wrong. Try another question from the study bank.</p>"+
"</div>";

return;

}


$("askResult").innerHTML=

'<div class="card">'+

'<div class="question-meta">'+
escapeHTML(best.subject)+
" • "+
escapeHTML(best.topic)+
"</div>"+

"<h3>"+
escapeHTML(best.front)+
"</h3>"+

'<div class="answer-box">'+
"<b>Answer</b>"+
"<p>"+
escapeHTML(best.back)+
"</p>"+
"</div>"+

"</div>";

}

/* =========================================================
   QUIZ
========================================================= */

function getQuizPool(){

var subject=$("quizSubject").value;
var topic=$("quizTopic").value;
var difficulty=$("quizDifficulty").value;

var pool=QUESTIONS.filter(
function(q){

var subjectOK=
subject==="ALL"
?
profile.subjects.indexOf(q.subject)!==-1
:
q.subject===subject;

var levelOK=q.level===profile.level;

var topicOK=
topic==="ALL" ||
q.topic===topic;

var difficultyOK=
difficulty==="ALL" ||
q.difficulty===difficulty;

return subjectOK &&
levelOK &&
topicOK &&
difficultyOK;

}
);


/* If there are no questions for the chosen difficulty,
   retry without difficulty restriction. */

if(pool.length===0 && difficulty!=="ALL"){

pool=QUESTIONS.filter(
function(q){

var subjectOK=
subject==="ALL"
?
profile.subjects.indexOf(q.subject)!==-1
:
q.subject===subject;

var levelOK=q.level===profile.level;

var topicOK=
topic==="ALL" ||
q.topic===topic;

return subjectOK &&
levelOK &&
topicOK;

}
);

}


/* Final fallback */

if(pool.length===0){

pool=QUESTIONS.filter(
function(q){

return profile.subjects.indexOf(q.subject)!==-1 &&
q.level===profile.level;

}
);

}

return shuffle(pool);

}


function beginQuiz(){

var pool=getQuizPool();

if(pool.length===0){

alert(
"There are no questions matching your selection yet."
);

return;

}

var count=parseInt(
$("quizCount").value,
10
);

if(count>pool.length){
count=pool.length;

quizState={

};

function chooseAnswer(choice){

if(!quizState || quizState.answered){
return;
}

quizState.answered=true;

var q=quizState.questions[quizState.index];

var buttons=document.querySelectorAll(".option");

for(var i=0;i<buttons.length;i++){

buttons[i].disabled=true;

if(i===q.a){
buttons[i].classList.add("correct");
}

if(i===choice && choice!==q.a){
buttons[i].classList.add("wrong");
}

}

var correct=choice===q.a;

if(correct){
quizState.score++;
}

profile.stats.answered++;

if(correct){
profile.stats.correct++;
}


/* SUBJECT */

if(!profile.stats.subject[q.subject]){

profile.stats.subject[q.subject]={
answered:0,
correct:0
};

}

profile.stats.subject[q.subject].answered++;

if(correct){
profile.stats.subject[q.subject].correct++;
}


/* TOPIC */

if(!profile.stats.topic[q.topic]){

profile.stats.topic[q.topic]={
answered:0,
correct:0
};

}

profile.stats.topic[q.topic].answered++;

if(correct){
profile.stats.topic[q.topic].correct++;
}


/* NEW XP + DAILY + STREAK */

addStudyProgress(correct);

saveProfile();


$("answerBox").innerHTML=

'<div class="answer-box">'+

"<b>"+
(correct ? "✅ Correct!" : "❌ Not quite.")+

);

{

"</tr>"+

rows+

"</table>"+

profile.stats.todayAnswered+
" / "+
profile.stats.dailyGoal+

'<div class="progress">'+

Math.min(
100,
Math.round(
profile.stats.todayAnswered/

100
)
)+

function renderCalculator(){

var expression="";

$("main").innerHTML=

'<section class="screen">'+

'<button class="back" id="calcBack">← Back</button>'+

"<h2>🧮 Calculator</h2>"+

'<div class="card">'+

'<div class="calc-display" id="calcDisplay">0</div>'+

'<div class="calc-grid">'+

'<button data-calc="C">C</button>'+
'<button data-calc="(">(</button>'+
'<button data-calc=")">)</button>'+
'<button data-calc="/">÷</button>'+

'<button data-calc="7">7</button>'+
'<button data-calc="8">8</button>'+
'<button data-calc="9">9</button>'+
'<button data-calc="*">×</button>'+

'<button data-calc="4">4</button>'+
'<button data-calc="5">5</button>'+
'<button data-calc="6">6</button>'+
'<button data-calc="-">−</button>'+

'<button data-calc="1">1</button>'+
'<button data-calc="2">2</button>'+
'<button data-calc="3">3</button>'+
'<button data-calc="+">+</button>'+

'<button data-calc="0">0</button>'+
'<button data-calc=".">.</button>'+
'<button data-calc="BACK">⌫</button>'+
'<button class="equal" data-calc="=">=</button>'+

"</div>"+

"</div>"+

"</section>";

$("calcBack").addEventListener(
"click",
function(){
renderPage("profile");
}
);

var display=$("calcDisplay");

var buttons=document.querySelectorAll("[data-calc]");

for(var i=0;i<buttons.length;i++){

buttons[i].addEventListener(
"click",
function(){

var value=this.getAttribute("data-calc");

if(value==="C"){

expression="";
display.textContent="0";
return;

}

if(value==="BACK"){

expression=
expression.substring(
0,
expression.length-1
);

display.textContent=
expression || "0";

return;

}

if(value==="="){

try{

var result=safeCalculate(expression);

expression=String(result);

display.textContent=expression;

}catch(error){

display.textContent="Error";
expression="";

}

return;

}

if(expression.length<40){

expression+=value;

display.textContent=expression;

}

}
);

}

}


/* =========================================================
   SAFE CALCULATOR
========================================================= */

function safeCalculate(expression){

if(!expression){
throw new Error("Empty");
}

if(!/^[0-9+\-*/().\s]+$/.test(expression)){
throw new Error("Invalid");
}

var tokens=expression.match(
/\d+(?:\.\d+)?|[+\-*/()]|\s+/g
);

if(!tokens){
throw new Error("Invalid");
}

var clean=[];

for(var i=0;i<tokens.length;i++){

if(!/\s/.test(tokens[i])){
clean.push(tokens[i]);
}

}

var position=0;

function parseExpression(){

var value=parseTerm();

while(
position<clean.length &&
(clean[position]==="+" ||
clean[position]==="-")
){

var operator=clean[position++];

var right=parseTerm();

if(operator==="+"){
value+=right;
}else{
value-=right;
}

}

return value;

}


function parseTerm(){

var value=parseFactor();

while(
position<clean.length &&
(clean[position]==="*" ||
clean[position]==="/")
){

var operator=clean[position++];

var right=parseFactor();

if(operator==="*"){

value*=right;

}else{

if(right===0){
throw new Error("Zero");
}

value/=right;

}

}

return value;

}


function parseFactor(){

if(clean[position]==="-"){

position++;

return -parseFactor();

}

if(clean[position]==="+"){

position++;

return parseFactor();

}

if(clean[position]==="("){

position++;

var value=parseExpression();

if(clean[position]!==")"){
throw new Error("Parentheses");
}

position++;

return value;

}

var token=clean[position++];

if(
!token ||
!/^\d+(?:\.\d+)?$/.test(token)
){

throw new Error("Number");

}

return Number(token);

}

var result=parseExpression();

if(position!==clean.length){
throw new Error("Invalid");
}

if(!isFinite(result)){
throw new Error("Invalid");
}

return Math.round(
result*100000000
)/100000000;

}
